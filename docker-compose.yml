version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8001:8001"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application \
               --bind 0.0.0.0:8001 \
               --workers 4 \
               --threads 8 \
               --timeout 60 \
               --max-requests 2000 \
               --max-requests-jitter 200 \
               --access-logfile - \
               --error-logfile -"

  telegram-bot:
    build: ./telegram-bot
    restart: unless-stopped
    env_file:
      - .env

volumes:
  pgdata:
